<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>استعراض التقرير PDF</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#e8ebf2;color:#273455}header{position:sticky;top:0;z-index:2;background:#fff;box-shadow:0 1px 10px #17215316;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}button,a{font:inherit;font-size:13px;padding:8px 12px;background:#f0f2f8;border:1px solid #dce1ee;border-radius:8px;color:#273455;cursor:pointer;text-decoration:none}button:disabled{opacity:.4;cursor:default}#page-label{font-size:12px;min-width:74px;text-align:center}#status{font-size:13px;text-align:center;padding:12px;line-height:1.8}#viewport{overflow:auto;padding:16px;display:flex;justify-content:safe center;min-height:200px}canvas{display:block;box-shadow:0 2px 15px #17215320;background:white;max-width:none}#error{display:none;text-align:center;line-height:2;padding:30px}a.download{background:#30388b;color:white;border-color:#30388b}button:focus-visible,a:focus-visible{outline:3px solid #8582ed;outline-offset:2px}@media(max-width:480px){header{gap:5px;padding:8px 5px}button,a{padding:8px;font-size:11px}#viewport{padding:8px}#page-label{min-width:60px}}
</style></head><body><header aria-label="أدوات ملف PDF"><button id="previous" disabled aria-label="الصفحة السابقة">→</button><span id="page-label" aria-live="polite">— / —</span><button id="next" disabled aria-label="الصفحة التالية">←</button><button id="minus" disabled aria-label="تصغير">−</button><button id="fit" disabled>ملاءمة العرض</button><button id="plus" disabled aria-label="تكبير">＋</button><a class="download" id="download" target="_blank" rel="noopener">فتح / تنزيل ↗</a></header><div id="status" role="status" aria-live="polite">جارٍ تحميل ملف PDF…</div><div id="error" role="alert">تعذر عرض الملف داخل الصفحة. يمكنك فتحه أو تنزيله من الزر أعلاه.</div><main id="viewport"><canvas id="page" aria-label="صفحة التقرير"></canvas></main><script type="module" src="pdf-viewer.js?v=20261104-pdf-archive-2"></script></body></html>
