<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Future Industrialists · Site temporarily closed</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{display:grid;place-items:center;min-height:100vh;padding:24px;font-family:"Readex Pro",system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;background:radial-gradient(120% 120% at 100% 0%,#3c58a7 0%,#232c78 50%,#161c55 100%)}
main{text-align:center;max-width:560px}
img{width:min(260px,60vw);height:auto;margin-bottom:28px;filter:drop-shadow(0 12px 30px rgba(8,12,44,.45))}
h1{font-size:clamp(30px,5vw,44px);font-weight:800;line-height:1.3;margin-bottom:14px}
p{font-size:clamp(17px,2.4vw,20px);line-height:1.8;color:#dfe7fb}
.tag{display:inline-block;margin-bottom:20px;padding:6px 16px;border-radius:999px;background:rgba(255,210,63,.16);border:1px solid rgba(255,210,63,.55);color:#ffd23f;font-size:15px;font-weight:700}
</style>
</head>
<body>
<main>
  <img src="../img/game-logo-white.webp" alt="Future Industrialists">
  <span class="tag">Site temporarily closed</span>
  <h1>We are updating the site</h1>
  <p>The site is temporarily closed. We will be back soon.</p>
</main>
</body>
